services:

  - type: web

    name: legalease-api

    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.8-flash

      - key: MOCK_AI
        value: "false"

      - key: CORS_ORIGINS
        sync: false